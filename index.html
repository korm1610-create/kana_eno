<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひらがなバトル</title>
<style>
:root{
  --cream:#FFF7EA;
  --ink:#3A2E28;
  --green:#3E9B4F; --blue:#2F6FDB; --red:#E0453C; --purple:#8C4FC9; --yellow:#F2C230;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%, #FFE9C7 0%, transparent 45%),
    radial-gradient(circle at 90% 90%, #E6E0FF 0%, transparent 45%),
    var(--cream);
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color:var(--ink);
  padding:12px;
}
h1{ text-align:center; font-size:24px; margin:6px 0 2px; letter-spacing:.04em; }
.legend{ text-align:center; font-size:12px; color:#8a7a6d; margin-bottom:10px; }
.wrap{ max-width:720px; margin:0 auto; }

#startScreen{
  max-width:420px; margin:20px auto; background:#fff; border-radius:24px;
  padding:24px; text-align:center; box-shadow:0 16px 40px -20px rgba(0,0,0,0.3);
}
#startScreen img{ width:180px; border-radius:12px; box-shadow:0 8px 20px -10px rgba(0,0,0,0.4); }
#startScreen p{ font-size:13px; line-height:1.8; color:#6b5b50; text-align:left; }
#startScreen button{
  margin-top:10px; border:none; border-radius:18px; padding:14px 32px;
  background:linear-gradient(180deg,var(--red),#B8332B); color:#fff;
  font-size:18px; font-weight:800; cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,0.15);
}
#startScreen button:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,0.15); }

#game{ display:none; }

.turnwheel-wrap{ display:flex; flex-direction:column; align-items:center; margin:0; }
.turnwheel-label{ font-size:11px; font-weight:800; color:#a0897a; margin-top:-4px; }
#turnArrowGroup{ transform-origin:80px 80px; transition:transform .3s ease; }
.opponents{ display:flex; justify-content:space-around; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.opp{
  background:#fff; border-radius:16px; padding:8px 10px; text-align:center;
  min-width:78px; box-shadow:0 4px 10px -6px rgba(0,0,0,0.25);
  border:3px solid transparent; transition:.2s;
}
.opp.active{ border-color:var(--yellow); transform:translateY(-3px); }
.opp .avatar{ font-size:26px; }
.opp .name{ font-size:11px; font-weight:700; }
.opp .count{ font-size:11px; color:#a0897a; }
.mini-stack{ display:flex; justify-content:center; margin:5px 0 3px; min-height:26px; flex-wrap:wrap-reverse; }
.mini-stack img{ width:15px; height:21px; border-radius:2px; box-shadow:0 1px 2px rgba(0,0,0,0.35); margin-left:-9px; }
.mini-stack img:first-child{ margin-left:0; }

.center{ display:flex; align-items:center; justify-content:center; gap:22px; margin:14px 0; flex-wrap:wrap; }
.pile-label{ text-align:center; font-size:11px; color:#a0897a; margin-top:4px; font-weight:700; }
.cardimg{
  width:110px; height:154px; border-radius:12px; object-fit:cover;
  box-shadow:0 8px 18px -8px rgba(0,0,0,0.45);
}
#drawPile{ position:relative; cursor:pointer; }
#drawPile .count{ position:absolute; bottom:-18px; left:0; right:0; text-align:center; font-size:11px; color:#8a7a6d; font-weight:700; }

.color-flag{ font-size:11px; font-weight:800; padding:4px 10px; border-radius:10px; color:#fff; }
.pending-badge{
  margin-top:6px; font-size:13px; font-weight:900; color:#fff;
  background:linear-gradient(180deg,#FF6B6B,#C93030); padding:5px 12px; border-radius:12px;
  box-shadow:0 4px 8px -4px rgba(0,0,0,0.4);
  animation:pendingPulse 0.6s ease-in-out infinite alternate;
}
@keyframes pendingPulse{
  from{ transform:scale(1); }
  to{ transform:scale(1.08); }
}

.log{
  background:#fff; border-radius:14px; padding:8px 12px; font-size:12px;
  max-height:64px; overflow-y:auto; color:#6b5b50; margin-bottom:10px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,0.05);
}
.log div{ padding:1px 0; }

.hand-area{ background:#fff; border-radius:20px; padding:14px 10px 10px; box-shadow:0 -6px 20px -14px rgba(0,0,0,0.3); }
.hand-label{ text-align:center; font-size:12px; color:#a0897a; margin-bottom:6px; font-weight:700; }
.hand{ display:flex; gap:8px; overflow-x:auto; padding:6px 4px 12px; scroll-snap-type:x proximity; justify-content:center; }
.card{
  flex:0 0 auto; width:66px; height:92px; border-radius:9px; cursor:pointer;
  overflow:hidden; box-shadow:0 4px 8px -4px rgba(0,0,0,0.35);
  transition:transform .12s ease, box-shadow .12s ease, opacity .12s, filter .12s;
  scroll-snap-align:start;
}
.card img{ width:100%; height:100%; object-fit:cover; display:block; }
.flying-card{
  position:fixed; z-index:120; border-radius:9px; object-fit:cover;
  box-shadow:0 10px 24px -8px rgba(0,0,0,0.55);
  transform:rotate(-4deg);
  transition:left .46s cubic-bezier(.3,.7,.2,1), top .46s cubic-bezier(.3,.7,.2,1),
             width .46s cubic-bezier(.3,.7,.2,1), height .46s cubic-bezier(.3,.7,.2,1),
             transform .46s cubic-bezier(.3,.7,.2,1), opacity .3s ease;
  pointer-events:none;
}
.skip-badge{
  position:fixed; z-index:130; transform:translate(-50%,-50%) scale(0.6);
  background:linear-gradient(180deg,#9b8a7d,#6b5b50); color:#fff;
  font-weight:900; font-size:13px; padding:8px 14px; border-radius:16px;
  box-shadow:0 8px 16px -6px rgba(0,0,0,0.5);
  white-space:nowrap; pointer-events:none;
  animation:skipPop 1.4s ease forwards;
}
.saigo-bubble{
  position:fixed; z-index:131; transform:translate(-50%,-100%);
  background:#fff; color:#FF6B85; font-weight:900; font-size:14px;
  padding:8px 16px; border-radius:18px; border:3px solid #FF6B85;
  box-shadow:0 8px 16px -6px rgba(0,0,0,0.4);
  white-space:nowrap; pointer-events:none;
  animation:saigoPop 1.5s ease forwards;
}
.agari-bubble{
  position:fixed; z-index:132; transform:translate(-50%,-100%);
  background:linear-gradient(180deg,#FFD166,#F0A020); color:#fff;
  font-weight:900; font-size:18px;
  padding:10px 20px; border-radius:20px; border:3px solid #fff;
  box-shadow:0 10px 20px -6px rgba(0,0,0,0.5);
  white-space:nowrap; pointer-events:none;
  animation:agariPop 1.8s ease forwards;
  text-shadow:2px 2px 0 rgba(0,0,0,0.15);
}
.color-bubble{
  position:fixed; z-index:132; transform:translate(-50%,-100%);
  color:#fff; font-weight:900; font-size:16px;
  padding:8px 18px; border-radius:18px; border:3px solid #fff;
  box-shadow:0 8px 16px -6px rgba(0,0,0,0.45);
  white-space:nowrap; pointer-events:none;
  animation:agariPop 1.5s ease forwards;
  text-shadow:1px 1px 0 rgba(0,0,0,0.2);
}
.color-bubble::after{
  content:''; position:absolute; left:50%; bottom:-9px; transform:translateX(-50%);
  border-width:9px 7px 0 7px; border-style:solid; border-color:inherit transparent transparent transparent;
  border-top-color:currentColor; opacity:0;
}
.defense-bubble{
  position:fixed; z-index:132; transform:translate(-50%,-100%);
  background:#fff; color:#5A9BD4; font-weight:900; font-size:16px;
  padding:8px 18px; border-radius:18px; border:3px solid #5A9BD4;
  box-shadow:0 8px 16px -6px rgba(0,0,0,0.4);
  white-space:nowrap; pointer-events:none;
  animation:agariPop 1.5s ease forwards;
}
.defense-bubble::after{
  content:''; position:absolute; left:50%; bottom:-10px; transform:translateX(-50%);
  border-width:10px 8px 0 8px; border-style:solid; border-color:#5A9BD4 transparent transparent transparent;
}
.agari-bubble::after{
  content:''; position:absolute; left:50%; bottom:-10px; transform:translateX(-50%);
  border-width:10px 8px 0 8px; border-style:solid; border-color:#F0A020 transparent transparent transparent;
}
@keyframes agariPop{
  0%{ opacity:0; transform:translate(-50%,-60%) scale(0.4) rotate(-8deg); }
  20%{ opacity:1; transform:translate(-50%,-115%) scale(1.25) rotate(4deg); }
  35%{ transform:translate(-50%,-100%) scale(1) rotate(-2deg); }
  70%{ opacity:1; transform:translate(-50%,-100%) scale(1) rotate(0); }
  100%{ opacity:0; transform:translate(-50%,-130%) scale(0.9); }
}
.saigo-bubble::after{
  content:''; position:absolute; left:50%; bottom:-10px; transform:translateX(-50%);
  border-width:10px 8px 0 8px; border-style:solid; border-color:#FF6B85 transparent transparent transparent;
}
.saigo-bubble::before{
  content:''; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); z-index:1;
  border-width:7px 6px 0 6px; border-style:solid; border-color:#fff transparent transparent transparent;
}
@keyframes saigoPop{
  0%{ opacity:0; transform:translate(-50%,-80%) scale(0.5); }
  15%{ opacity:1; transform:translate(-50%,-108%) scale(1.15); }
  25%{ transform:translate(-50%,-100%) scale(1); }
  78%{ opacity:1; transform:translate(-50%,-100%) scale(1); }
  100%{ opacity:0; transform:translate(-50%,-124%) scale(0.95); }
}
.splat-particle{
  position:fixed; border-radius:50%; pointer-events:none; z-index:125;
  animation:splatFly .6s ease-out forwards;
}
@keyframes splatFly{
  0%{ transform:translate(0,0) scale(1); opacity:1; }
  100%{ transform:translate(var(--tx), var(--ty)) scale(0.25); opacity:0; }
}
@keyframes skipPop{
  0%{ opacity:0; transform:translate(-50%,-50%) scale(0.5); }
  15%{ opacity:1; transform:translate(-50%,-50%) scale(1.15); }
  25%{ transform:translate(-50%,-50%) scale(1); }
  75%{ opacity:1; transform:translate(-50%,-70%) scale(1); }
  100%{ opacity:0; transform:translate(-50%,-95%) scale(0.95); }
}
.card.playable{ transform:translateY(-8px); box-shadow:0 10px 18px -6px rgba(0,0,0,0.45); }
.card.disabled{ opacity:.65; cursor:not-allowed; }

.modal-back{ position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:center; justify-content:center; z-index:50; }
.modal-back.show{ display:flex; }
.modal{ background:#fff; border-radius:18px; padding:20px; max-width:320px; width:88%; text-align:center; }
.modal h3{ margin:0 0 12px; font-size:16px; }
.swatches{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
.swatch{
  width:54px; height:54px; cursor:pointer; border:3px solid #fff;
  box-shadow:0 4px 8px -4px rgba(0,0,0,0.3);
  border-radius:60% 40% 55% 45% / 45% 55% 40% 60%;
  position:relative; transition:transform .15s ease;
}
.swatch::after{
  content:''; position:absolute; left:50%; bottom:-7px; width:9px; height:12px;
  background:inherit; border-radius:0 50% 50% 50%; transform:translateX(-50%) rotate(45deg);
}
.swatch:hover{ transform:scale(1.08) rotate(-4deg); }
.g-bg{ background:var(--green); } .b-bg{ background:var(--blue); } .r-bg{ background:var(--red); }
.p-bg{ background:var(--purple); } .y-bg{ background:var(--yellow); }
.target-btn{ display:block; width:100%; margin:6px 0; padding:10px; border-radius:12px; border:none; background:#f3ece3; font-weight:700; cursor:pointer; font-size:14px; }

#saigoWrap{ position:fixed; left:50%; bottom:150px; transform:translateX(-50%); z-index:60; display:none; }
#saigoBtn{ background:linear-gradient(180deg,#FF8FA3,#FF6B85); color:#fff; border:none; border-radius:20px; padding:14px 28px; font-size:18px; font-weight:900; box-shadow:0 6px 0 rgba(0,0,0,0.15); cursor:pointer; }
#saigoBar{ height:5px; background:#fff; border-radius:4px; margin-top:6px; width:100%; overflow:hidden; }
#saigoBar div{ height:100%; background:#FF6B85; width:100%; }

#winOverlay{ position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none; align-items:center; justify-content:center; z-index:70; }
#winOverlay.show{ display:flex; }
.win-card{ background:#fff; border-radius:22px; padding:30px; text-align:center; max-width:300px; }
.win-card .big{ font-size:44px; }
.win-card button{ margin:6px 4px; border:none; border-radius:16px; padding:12px 20px; font-weight:800; cursor:pointer; font-size:14px; }
.win-card .btn-primary{ background:linear-gradient(180deg,var(--green),#2E7A3B); color:#fff; }
.win-card .btn-secondary{ background:#fff; color:var(--ink); border:2px solid #d9c8b7; }
.win-card .btn-row{ margin-top:14px; display:flex; flex-direction:column; gap:6px; }
</style>
</head>
<body>

<div class="wrap">
<h1>ひらがなバトル</h1>
<div class="legend">🟩あ段　🟦え段　🟥い段　🟪う段　🟨お段　同じ色 or 同じ行のカードが出せるよ</div>

<div id="startScreen">
  <img id="coverImg" src="" alt="HIRAGANA BATTLE">
  <p>
  4人対戦(あなた＋AI3人)のひらがなカードゲームです。<br><br>
  ・場のカードと同じ「色」か「マーク(記号)」のカードを出そう<br>
  ・出せない時は自動で山札を1枚引くよ<br>
  ・手札が0枚になったら勝ち!
  </p>
  <button onclick="startGame()">はじめる</button>
</div>

<div id="game">
  <div class="opponents" id="opponents"></div>

  <div class="center">
    <div class="turnwheel-wrap">
      <svg viewBox="0 0 160 160" width="86" height="86">
        <circle cx="80" cy="80" r="55" fill="none" stroke="#eee5d8" stroke-width="2"/>
        <defs>
          <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#FF6B85"/>
          </marker>
        </defs>
        <g id="turnArrowGroup">
          <path d="M70.45,25.84 A55,55 0 1 1 25.84,89.55" fill="none" stroke="#FF6B85" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
        </g>
        <g id="wheelAvatars"></g>
      </svg>
      <div class="turnwheel-label" id="turnDirLabel"></div>
    </div>
    <div style="text-align:center;">
      <img class="cardimg" id="drawPile" src="" onclick="humanDraw()">
      <div class="pile-label" id="drawCount"></div>
    </div>
    <div style="text-align:center;">
      <img class="cardimg" id="discardTop" src="">
      <div style="margin-top:6px;"><span class="color-flag" id="colorFlag"></span></div>
      <div id="pendingBadge" class="pending-badge" style="display:none;">攻撃 +<span id="pendingN">0</span></div>
    </div>
  </div>

  <div class="hand-area">
    <div class="hand-label" id="handLabel">あなたの手札</div>
    <div class="hand" id="hand"></div>
  </div>
</div>
</div>

<div class="modal-back" id="colorModal">
  <div class="modal">
    <h3>好きな色をえらんでね</h3>
    <div class="swatches">
      <div class="swatch g-bg" onclick="resolveColorChoice('green')"></div>
      <div class="swatch b-bg" onclick="resolveColorChoice('blue')"></div>
      <div class="swatch r-bg" onclick="resolveColorChoice('red')"></div>
      <div class="swatch p-bg" onclick="resolveColorChoice('purple')"></div>
      <div class="swatch y-bg" onclick="resolveColorChoice('yellow')"></div>
    </div>
  </div>
</div>

<div class="modal-back" id="targetModal">
  <div class="modal">
    <h3>だれと手札を交換する?</h3>
    <div id="targetList"></div>
  </div>
</div>

<div id="saigoWrap">
  <button id="saigoBtn" onclick="callSaigo()">さいご!</button>
  <div id="saigoBar"><div id="saigoBarInner"></div></div>
</div>

<div id="winOverlay">
  <div class="win-card">
    <div style="font-size:14px;color:#8a7a6d;font-weight:800;letter-spacing:.1em;margin-bottom:8px;">🏁 ゲーム終了</div>
    <div class="big" id="winEmoji">🎉</div>
    <div id="winText" style="font-size:18px;font-weight:800;margin-top:6px;"></div>
    <div class="btn-row">
      <button class="btn-primary" onclick="location.reload()">もう一度あそぶ</button>
      <button class="btn-secondary" onclick="alert('この機能は準備中です')">他のゲームで遊ぶ</button>
    </div>
  </div>
</div>

const CHAR_ROW = {};
(function(){
  const ROWS = {
    a:  ['あ','い','う','え','お'],
    ka: ['か','き','く','け','こ'],
    sa: ['さ','し','す','せ','そ'],
    ta: ['た','ち','つ','て','と'],
    na: ['な','に','ぬ','ね','の'],
    ha: ['は','ひ','ふ','へ','ほ'],
    ma: ['ま','み','む','め','も'],
    ya: ['や','ゆ','よ'],
    ra: ['ら','り','る','れ','ろ'],
    wa: ['わ','を','ん'],
  };
  Object.keys(ROWS).forEach(row => ROWS[row].forEach(ch => { CHAR_ROW[ch] = row; }));
})();
const ACTIONS = [
  {key:'skip', n:0},
  {key:'reverse', n:0},
  {key:'plus1', n:1},
  {key:'plus2', n:2},
  {key:'plus3', n:3},
];
const WILDS = [ {key:'plus5', n:5}, {key:'colorChange', n:0}, {key:'swap', n:0} ];

let state = null;
let uid = 0;
function nid(){ return 'c'+(uid++); }

const ACTION_NAME = {skip:'おやすみ', reverse:'ぎゃくまわり', plus1:'+1', plus2:'+2', plus3:'+3'};
const WILD_NAME = {plus5:'+5', colorChange:'いろかえ', swap:'こうかん', defense:'ぼうぎょ'};
function cardLabelText(card){
  if(card.type==='letter') return card.char;
  if(card.type==='action') return ACTION_NAME[card.action];
  if(card.type==='wild') return WILD_NAME[card.wildType];
}

function cardImage(card){
  if(card.type==='letter') return IMG.letters[card.char];
  if(card.type==='action') return IMG[card.action][card.color];
  if(card.type==='wild') return IMG[card.wildType==='defense' ? 'defense' : card.wildType];
}

function buildDeck(){
  const deck = [];
  COLORS.forEach(color=>{
    LETTERS[color].forEach(ch=>{ deck.push({id:nid(), type:'letter', color, char:ch}); });
    ACTIONS.forEach(a=>{ deck.push({id:nid(), type:'action', color, action:a.key, n:a.n}); });
  });
  WILDS.forEach(w=>{
    deck.push({id:nid(), type:'wild', wildType:w.key, n:w.n});
    deck.push({id:nid(), type:'wild', wildType:w.key, n:w.n});
  });
  // 防御カード3枚(ペンキ攻撃を白紙にできる)
  for(let i=0;i<3;i++){
    deck.push({id:nid(), type:'wild', wildType:'defense', n:0});
  }
  return shuffle(deck);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function mod(n,m){ return ((n%m)+m)%m; }

function startGame(){
  document.getElementById('startScreen').style.display='none';
  document.getElementById('game').style.display='block';

  const players = [
    {id:0, name:'あなた', isHuman:true, avatar:'🧑', hand:[]},
    {id:1, name:'くまさん', isHuman:false, avatar:'🐻', hand:[]},
    {id:2, name:'うさぎさん', isHuman:false, avatar:'🐰', hand:[]},
    {id:3, name:'ねこさん', isHuman:false, avatar:'🐱', hand:[]},
  ];
  const deck = buildDeck();
  for(let r=0;r<5;r++){ players.forEach(p=> p.hand.push(deck.pop())); }
  let starter;
  do{ starter = deck.pop(); }while(!starter || starter.type!=='letter');

  state = { players, deck, discard:[starter], currentColor: starter.color, direction:1, turn:0, over:false, saigoActive:false, saigoTimeout:null, finished:[], finishOrder:[], pendingDraw:0, pendingPlusN:0 };
  renderAll();
  log(`スタート! 最初のカードは「${starter.char}」`);
  continueGame();
}

let audioCtx;
function getAC(){ if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } return audioCtx; }

function playTone(freqs, opts){
  const ctx = getAC();
  const now = ctx.currentTime;
  const type = (opts&&opts.type)||'triangle';
  const step = (opts&&opts.step) || 0.07;
  const dur = (opts&&opts.dur) || 0.22;
  const vol = (opts&&opts.vol) || 0.16;
  freqs.forEach((f,i)=>{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = f;
    const start = now + i*step;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(vol, start+0.015);
    gain.gain.exponentialRampToValueAtTime(0.0005, start+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(start); osc.stop(start+dur+0.02);
  });
}

function playNoiseBurst(dur, vol){
  const ctx = getAC();
  const now = ctx.currentTime;
  const bufferSize = Math.floor(ctx.sampleRate*dur);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
  const src = ctx.createBufferSource(); src.buffer = buffer;
  const gain = ctx.createGain(); gain.gain.value = vol||0.18;
  const filter = ctx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=1200; filter.Q.value=0.8;
  src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  src.start(now); src.stop(now+dur);
}

function topDiscard(){ return state.discard[state.discard.length-1]; }

function cardPlusN(card){
  if(card.type==='action' && card.action && card.action.startsWith('plus')) return card.n;
  if(card.type==='wild' && card.wildType==='plus5') return card.n;
  return 0;
}

function canPlay(card){
  const top = topDiscard();
  // ペンキ攻撃スタッキング中は、同じ数以上の+Nカード or 防御カードのみ出せる
  if(state.pendingDraw > 0){
    if(card.type==='wild' && card.wildType==='defense') return true;
    const n = cardPlusN(card);
    return n >= state.pendingPlusN;
  }
  // 通常時は防御カードは出せない(攻撃を受けた時にしか使えない)
  if(card.type==='wild' && card.wildType==='defense') return false;
  if(card.type==='wild') return true;
  if(card.color === state.currentColor) return true;
  if(card.type==='action' && top.type==='action' && card.action===top.action) return true;
  // 同じ行(あかさたな…)のカードは色が違っても出せる
  if(card.type==='letter' && top.type==='letter' && CHAR_ROW[card.char] && CHAR_ROW[card.char]===CHAR_ROW[top.char]) return true;
  return false;
}

const SVGNS = 'http://www.w3.org/2000/svg';
const WHEEL_POS = [ {x:80,y:22}, {x:22,y:80}, {x:80,y:138}, {x:138,y:80} ];

function renderWheel(){
  const group = document.getElementById('turnArrowGroup');
  group.style.transform = state.direction===1 ? 'scale(1,1)' : 'scale(-1,1)';

  const wa = document.getElementById('wheelAvatars');
  wa.innerHTML = '';
  state.players.forEach((p,i)=>{
    const pos = WHEEL_POS[i];
    const isActive = state.turn===i && !state.over;
    if(isActive){
      const glow = document.createElementNS(SVGNS,'circle');
      glow.setAttribute('cx',pos.x); glow.setAttribute('cy',pos.y); glow.setAttribute('r',17);
      glow.setAttribute('fill','#FFE58A');
      wa.appendChild(glow);
    }
    const circle = document.createElementNS(SVGNS,'circle');
    circle.setAttribute('cx',pos.x); circle.setAttribute('cy',pos.y); circle.setAttribute('r',13);
    circle.setAttribute('fill','#fff');
    circle.setAttribute('stroke', isActive ? '#FFB020' : '#e3d8c9');
    circle.setAttribute('stroke-width', isActive ? 3 : 2);
    wa.appendChild(circle);
    const text = document.createElementNS(SVGNS,'text');
    text.setAttribute('x',pos.x); text.setAttribute('y',pos.y+5);
    text.setAttribute('text-anchor','middle'); text.setAttribute('font-size','15');
    text.textContent = p.avatar;
    wa.appendChild(text);
  });

  document.getElementById('turnDirLabel').textContent = state.direction===1 ? '→ みぎまわり' : '← ひだりまわり';
}

function renderHand(){

function anchorElFor(playerIdx, fallbackEl){
  if(fallbackEl) return fallbackEl;
  return document.getElementById('opp-'+playerIdx) || document.getElementById('discardTop');
}

function spawnPaintSplat(cx, cy, colors){
  const n = 9;
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className = 'splat-particle';
    const size = 5 + Math.random()*8;
    p.style.width = size+'px'; p.style.height = size+'px';
    p.style.left = (cx - size/2)+'px'; p.style.top = (cy - size/2)+'px';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    const angle = Math.random()*Math.PI*2;
    const dist = 26 + Math.random()*46;
    p.style.setProperty('--tx', (Math.cos(angle)*dist)+'px');
    p.style.setProperty('--ty', (Math.sin(angle)*dist)+'px');
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 620);
  }
}

function flyCardToCenter(sourceEl, card, onDone){
  const target = document.getElementById('discardTop');
  if(!sourceEl || !target){ onDone(); return; }
  const fromRect = sourceEl.getBoundingClientRect();
  const toRect = target.getBoundingClientRect();
  if(fromRect.width===0 || fromRect.height===0){ onDone(); return; }

  const flyer = document.createElement('img');
  flyer.src = cardImage(card);
  flyer.className = 'flying-card';
  flyer.style.left = fromRect.left+'px';
  flyer.style.top = fromRect.top+'px';
  flyer.style.width = fromRect.width+'px';
  flyer.style.height = fromRect.height+'px';
  document.body.appendChild(flyer);

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      flyer.style.left = toRect.left+'px';
      flyer.style.top = toRect.top+'px';
      flyer.style.width = toRect.width+'px';
      flyer.style.height = toRect.height+'px';
      flyer.style.transform = 'rotate(0deg)';
    });
  });

  setTimeout(()=>{
    flyer.remove();
    const colors = card.color ? [COLOR_HEX[card.color]] : Object.values(COLOR_HEX);
    spawnPaintSplat(toRect.left+toRect.width/2, toRect.top+toRect.height/2, colors);
    onDone();
  }, 480);
}

function nextIndex(from, steps){
  let i=from;
  for(let s=0;s<steps;s++){
    do{ i = mod(i+state.direction,4); }
    while(state.finished && state.finished.includes(i));
  }
  return i;
}
function reshuffleIfNeeded(){
  if(state.deck.length===0){ const top = state.discard.pop(); state.deck = shuffle(state.discard); state.discard=[top]; }
}
function drawCards(playerIdx, count){
  const p = state.players[playerIdx];
  for(let i=0;i<count;i++){ reshuffleIfNeeded(); if(state.deck.length===0) break; p.hand.push(state.deck.pop()); }
}

function animateDrawThenRun(playerIdx, count, onDone){
  if(count<=0){ onDone(); return; }
  const pile = document.getElementById('drawPile');
  const destEl = playerIdx===0 ? document.getElementById('hand') : document.getElementById('opp-'+playerIdx);
  if(!pile || !destEl){ drawCards(playerIdx, count); onDone(); return; }
  const fromRect = pile.getBoundingClientRect();
  const toRect = destEl.getBoundingClientRect();
  if(fromRect.width===0 || toRect.width===0){ drawCards(playerIdx, count); onDone(); return; }
  const destX = toRect.left + toRect.width/2 - (fromRect.width*0.7)/2;
  const destY = toRect.top + toRect.height/2 - (fromRect.height*0.7)/2;

  let remaining = count;
  for(let k=0;k<count;k++){
    setTimeout(()=>{
      const flyer = document.createElement('img');
      flyer.src = IMG.back;
      flyer.className = 'flying-card';
      flyer.style.left = fromRect.left+'px';
      flyer.style.top = fromRect.top+'px';
      flyer.style.width = fromRect.width+'px';
      flyer.style.height = fromRect.height+'px';
      flyer.style.transform = 'rotate(0deg)';
      document.body.appendChild(flyer);
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          flyer.style.left = destX+'px';
          flyer.style.top = destY+'px';
          flyer.style.width = (fromRect.width*0.7)+'px';
          flyer.style.height = (fromRect.height*0.7)+'px';
          flyer.style.opacity = '0.7';
        });
      });
      setTimeout(()=>{
        flyer.remove();
        remaining--;
        if(remaining===0){
          drawCards(playerIdx, count);
          onDone();
        }
      }, 380);
    }, k*110);
  }
}

function applyEffectAndAdvance(playerIdx, card, chosenColor, chosenTarget, onComplete){
  let steps = 1;
  const finish = ()=>{ state.turn = nextIndex(playerIdx, steps); onComplete(); };

  if(card.type==='action'){
    state.currentColor = card.color;
    if(card.action==='reverse'){
      const remaining = 4 - state.finished.length;
      if(remaining <= 2){
        // 残り2人の時、リバースは相手の1回休み扱い
        sfxSkip();
        const v = nextIndex(playerIdx,1);
        log(`${state.players[v].name}は1回休み`);
        showSkipBadge(v);
        steps=2; finish();
      } else {
        sfxReverse();
        state.direction *= -1; steps=1; finish();
      }
    } else if(card.action==='skip'){
      sfxSkip();
      const v=nextIndex(playerIdx,1); log(`${state.players[v].name}は1回休み`); showSkipBadge(v); steps=2; finish();
    } else if(card.action.startsWith('plus')){
      sfxAttack();
      // スタッキング:攻撃を累積して次の人にターンを渡す(引かせない)
      state.pendingDraw += card.n;
      state.pendingPlusN = card.n;
      steps=1; finish();
    } else { steps=1; finish(); }
  } else if(card.type==='wild'){
    if(card.wildType==='defense'){
      // 防御カード:累積攻撃を白紙にして、選んだ色に変更して次の人へ
      sfxSparkle();
      showDefenseBubble(playerIdx);
      state.pendingDraw = 0;
      state.pendingPlusN = 0;
      if(chosenColor){
        state.currentColor = chosenColor;
        setTimeout(()=> showColorBubble(playerIdx, chosenColor), 900);
      }
      steps=1; finish();
    } else {
      state.currentColor = chosenColor;
      showColorBubble(playerIdx, chosenColor);
      if(card.wildType==='plus5'){
        sfxAttack();
        state.pendingDraw += card.n;
        state.pendingPlusN = card.n;
        steps=1; finish();
      } else if(card.wildType==='swap'){
        sfxReverse();
        const other = state.players[chosenTarget]; const me = state.players[playerIdx];
        const tmp = me.hand; me.hand = other.hand; other.hand = tmp;
        log(`${state.players[playerIdx].name}と${other.name}が手札を交換した`); steps=1; finish();
      } else { steps=1; finish(); }
    }
  } else { state.currentColor = card.color; steps=1; finish(); }
}

  const anchor = playerIdx===0 ? document.getElementById('hand') : document.getElementById('opp-'+playerIdx);
  if(!anchor) return;

  document.body.appendChild(bubble);
  setTimeout(()=> bubble.remove(), 1800);
}

function afterPlayChecks(playerIdx){
  const p = state.players[playerIdx];
  if(p.hand.length===0){
    if(!state.finishOrder.includes(playerIdx)){
      state.finishOrder.push(playerIdx);
      state.finished.push(playerIdx);
      sfxWin();
      showAgariBubble(playerIdx);
      const rank = state.finishOrder.length;
      log(`🎉 ${p.name}が${rank}位であがった!`);
    }
    // 3人があがったら、残り1人を4位として終了
    if(state.finishOrder.length >= 3){
      const remaining = [0,1,2,3].find(i=>!state.finishOrder.includes(i));
      if(remaining!==undefined) state.finishOrder.push(remaining);
      endGame();
      return true;
    }
    // 手番があがった本人になっていたら次の人に進める
    if(state.finished.includes(state.turn)){
      state.turn = nextIndex(state.turn, 1);
    }
    return false; // まだ続行
  }
  if(p.hand.length===1){
    showSaigoBubble(playerIdx);
    if(p.isHuman){ triggerSaigo(); } else { log(`${p.name}「さいご!」`); }
  }
  return false;
}

function endGame(){
  state.over = true;
  const order = state.finishOrder;
  const humanRank = order.indexOf(0) + 1;
  const medals = ['🥇','🥈','🥉','4️⃣'];
  document.getElementById('winOverlay').classList.add('show');
  const emojiEl = document.getElementById('winEmoji');
  const textEl = document.getElementById('winText');

  const lines = order.map((pid,i)=>{
    const p = state.players[pid];
    const you = pid===0 ? ' (あなた)' : '';
    return `<div style="font-size:15px;margin:4px 0;">${medals[i]} ${p.avatar} ${p.name}${you}</div>`;
  }).join('');

  emojiEl.textContent = humanRank===1 ? '🎉' : medals[humanRank-1];
  textEl.innerHTML = `<div style="font-size:18px;font-weight:800;margin-bottom:10px;">${humanRank===1?'1位!あがり!':`あなたは${humanRank}位`}</div>${lines}`;
}

let pendingWildCardIdx = null;
let pendingSwapTarget = null;
let pendingWildEl = null;
let animating = false;

function humanDraw(){
  if(state.over || state.turn!==0 || animating) return;
  animating = true;
  // スタッキング中に山札をクリックしたら、累積分を全部引く
  if(state.pendingDraw > 0){
    const drawN = state.pendingDraw;
    state.pendingDraw = 0; state.pendingPlusN = 0;
    sfxAttack();
    animateDrawThenRun(0, drawN, ()=>{
      animating = false;
      log(`あなたが${drawN}枚引いた`);
      showSkipBadge(0);
      state.turn = nextIndex(0,1);
      renderAll();
      continueGame();
    });
    return;
  }
  sfxDraw();
  animateDrawThenRun(0, 1, ()=>{
    animating = false;
    log('あなたが山札から1枚引いた');
    state.turn = nextIndex(0,1);
    renderAll();
    continueGame();
  });
}

function humanPlay(idx, el){
  if(state.over || state.turn!==0 || animating) return;
  const human = state.players[0]; const card = human.hand[idx];
  if(!canPlay(card)) return;
  if(card.type==='wild'){
    pendingWildCardIdx = idx;
    pendingWildEl = el;
    if(card.wildType==='swap'){ openTargetModal(); } else { openColorModal(); }
    return;
  }
  human.hand.splice(idx,1); state.discard.push(card);
  log(`あなたが「${cardLabelText(card)}」を出した`);
  sfxPlay();
  animating = true;
  flyCardToCenter(el, card, ()=>{
    animating = false;
    applyEffectAndAdvance(0, card, undefined, undefined, ()=>{
      renderAll();
      if(afterPlayChecks(0)) return;
      continueGame();
    });
  });
}

function openColorModal(){ document.getElementById('colorModal').classList.add('show'); }
function openTargetModal(){
  const list = document.getElementById('targetList'); list.innerHTML='';
  state.players.forEach((p,i)=>{
    if(i===0) return;
    if(state.finished.includes(i)) return;
    const btn = document.createElement('button'); btn.className='target-btn';
    btn.textContent = `${p.avatar} ${p.name} (${p.hand.length}枚)`;
    btn.onclick = ()=>{ document.getElementById('targetModal').classList.remove('show'); pendingSwapTarget = i; openColorModal(); };
    list.appendChild(btn);
  });
  document.getElementById('targetModal').classList.add('show');
}

function resolveColorChoice(color){
  document.getElementById('colorModal').classList.remove('show');
  const human = state.players[0]; const idx = pendingWildCardIdx; const card = human.hand[idx];
  const el = pendingWildEl; const target = pendingSwapTarget;
  human.hand.splice(idx,1); state.discard.push(card);
  log(`あなたが「${cardLabelText(card)}」を出した`);
  sfxPlay();
  pendingWildCardIdx = null; pendingSwapTarget = null; pendingWildEl = null;
  animating = true;
  flyCardToCenter(el, card, ()=>{
    animating = false;
    applyEffectAndAdvance(0, card, color, target, ()=>{
      renderAll();
      if(afterPlayChecks(0)) return;
      continueGame();
    });
  });
}

function triggerSaigo(){
  state.saigoActive = true;
  document.getElementById('saigoWrap').style.display = 'block';
  const bar = document.getElementById('saigoBarInner');
  bar.style.transition = 'none'; bar.style.width='100%';
  requestAnimationFrame(()=>{ bar.style.transition='width 2.6s linear'; bar.style.width='0%'; });
  state.saigoTimeout = setTimeout(()=>{
    if(state.saigoActive){
      state.saigoActive = false;
      document.getElementById('saigoWrap').style.display='none';
      animateDrawThenRun(0, 2, ()=>{
        log('「さいご!」を言い忘れて2枚引いた…');
        renderAll();
      });
    }
  }, 2700);
}
function callSaigo(){
  if(!state.saigoActive) return;
  state.saigoActive = false; clearTimeout(state.saigoTimeout);
  document.getElementById('saigoWrap').style.display='none';
  log('あなた「さいご!」');
}

function continueGame(){
  if(state.over) return;
  if(state.turn===0){
    const human = state.players[0];
    const hasPlayable = human.hand.some(c=>canPlay(c));
    // スタッキング中で防御カードがない場合、累積分を全部引かされる
    if(state.pendingDraw > 0 && !hasPlayable){
      const drawN = state.pendingDraw;
      const resetPending = ()=>{ state.pendingDraw = 0; state.pendingPlusN = 0; };
      setTimeout(()=>{
        sfxAttack();
        animateDrawThenRun(0, drawN, ()=>{
          log(`あなたが${drawN}枚引いた`);
          showSkipBadge(0);
          resetPending();
          state.turn = nextIndex(0,1);
          renderAll();
          continueGame();
        });
      }, 500);
      return;
    }
    if(!hasPlayable){
      setTimeout(()=>{
        sfxDraw();
        animateDrawThenRun(0, 1, ()=>{
          log('あなたが山札を1枚引いた(出せるカードがなかった)');
          state.turn = nextIndex(0,1);
          renderAll();
          continueGame();
        });
      }, 500);
    } else { renderAll(); }
    return;
  }
  setTimeout(()=> aiTurn(state.turn), 800);
}

function aiChooseCard(p){
  const playable = p.hand.map((c,i)=>({c,i})).filter(x=>canPlay(x.c));
  if(playable.length===0) return null;
  // スタッキング中は反撃(小さい数の+N優先で温存、防御カードは大量攻撃の時使う)
  if(state.pendingDraw > 0){
    const defense = playable.find(x=> x.c.type==='wild' && x.c.wildType==='defense');
    // 累積4枚以上なら防御カード使用、それ以下は+Nで返す
    if(defense && state.pendingDraw >= 4) return defense;
    const counters = playable.filter(x=> cardPlusN(x.c) > 0);
    if(counters.length > 0){
      counters.sort((a,b)=> cardPlusN(a.c) - cardPlusN(b.c));
      return counters[0];
    }
    if(defense) return defense;
    return playable[0];
  }
  const offensive = playable.filter(x=> x.c.type==='action' && (x.c.action.startsWith('plus')||x.c.action==='skip'));
  if(offensive.length>0) return offensive[0];
  const letters = playable.filter(x=>x.c.type==='letter');
  if(letters.length>0) return letters[Math.floor(Math.random()*letters.length)];
  return playable[0];
}
function aiPickColor(p){
  const counts = {green:0,blue:0,red:0,purple:0,yellow:0};
  p.hand.forEach(c=>{ if(c.color) counts[c.color]++; });
  let best='green', max=-1;
  COLORS.forEach(col=>{ if(counts[col]>max){ max=counts[col]; best=col; } });
  return best;
}

function aiTurn(idx){
  if(state.over) return;
  const p = state.players[idx];
  const choice = aiChooseCard(p);
  if(!choice){
    // スタッキング中で防御カードがない場合、累積分を全部引く
    if(state.pendingDraw > 0){
      const drawN = state.pendingDraw;
      state.pendingDraw = 0; state.pendingPlusN = 0;
      sfxAttack();
      animateDrawThenRun(idx, drawN, ()=>{
        log(`${p.name}が${drawN}枚引いた`);
        showSkipBadge(idx);
        state.turn = nextIndex(idx,1);
        renderAll(); continueGame();
      });
      return;
    }
    sfxDraw();
    animateDrawThenRun(idx, 1, ()=>{
      log(`${p.name}が山札を1枚引いた`);
      state.turn = nextIndex(idx,1);
      renderAll(); continueGame();
    });
    return;
  }
  const card = p.hand[choice.i];
  p.hand.splice(choice.i,1); state.discard.push(card);
  log(`${p.name}が「${cardLabelText(card)}」を出した`);
  sfxPlay();
  let chosenColor, chosenTarget;
  if(card.type==='wild'){
    chosenColor = aiPickColor(p);
    if(card.wildType==='swap'){
      const others = [0,1,2,3].filter(i=>i!==idx && !state.finished.includes(i));
      if(others.length===0){
        // 他にプレイヤーがいない場合、swapできないので山札から引くフォールバック
        p.hand.push(card); state.discard.pop();
        sfxDraw();
        animateDrawThenRun(idx, 1, ()=>{
          state.turn = nextIndex(idx,1);
          renderAll(); continueGame();
        });
        return;
      }
      chosenTarget = others.reduce((a,b)=> state.players[a].hand.length<=state.players[b].hand.length ? a:b);
    }
  }
  const anchorEl = document.getElementById('opp-'+idx);
  flyCardToCenter(anchorEl, card, ()=>{
    applyEffectAndAdvance(idx, card, chosenColor, chosenTarget, ()=>{
      renderAll();
      if(afterPlayChecks(idx)) return;
      continueGame();
    });
  });
}

  div.textContent = msg;
  document.body.appendChild(div);
});
